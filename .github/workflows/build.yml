name: BuildWorld Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Configure Android signing key
        env:
          BUILDWORLD_KEYSTORE_BASE64: ${{ secrets.BUILDWORLD_KEYSTORE_BASE64 }}
          BUILDWORLD_KEYSTORE_PASSWORD: ${{ secrets.BUILDWORLD_KEYSTORE_PASSWORD }}
          BUILDWORLD_KEY_ALIAS: ${{ secrets.BUILDWORLD_KEY_ALIAS }}
          BUILDWORLD_KEY_PASSWORD: ${{ secrets.BUILDWORLD_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          if [ -n "$BUILDWORLD_KEYSTORE_BASE64" ]; then
            echo "$BUILDWORLD_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/buildworld-release.keystore"
            KEYSTORE_PATH="$HOME/.android/buildworld-release.keystore"
            KEYSTORE_USER="$BUILDWORLD_KEY_ALIAS"
            KEYSTORE_PASS="$BUILDWORLD_KEY_PASSWORD"
            echo "Using the persistent BuildWorld signing key."
          else
            echo "::warning::Persistent signing key is not configured. This APK will not be guaranteed installable as an update over APKs signed with another key."
            keytool -genkeypair -v \\
              -keystore "$HOME/.android/debug.keystore" \\
              -storepass android \\
              -alias androiddebugkey \\
              -keypass android \\
              -keyalg RSA \\
              -keysize 2048 \\
              -validity 10000 \\
              -dname "CN=Android Debug,O=Android,C=US"
            KEYSTORE_PATH="$HOME/.android/debug.keystore"
            KEYSTORE_USER="androiddebugkey"
            KEYSTORE_PASS="android"
          fi

          export KEYSTORE_PATH KEYSTORE_USER KEYSTORE_PASS
          python3 - <<'PY'
          import os
          from pathlib import Path
          preset = Path("export_presets.cfg")
          content = preset.read_text()
          marker = "[preset.0.options]\\n"
          signing = (
              f'keystore/debug="{os.environ["KEYSTORE_PATH"]}"\\n'
              f'keystore/debug_user="{os.environ["KEYSTORE_USER"]}"\\n'
              f'keystore/debug_password="{os.environ["KEYSTORE_PASS"]}"\\n'
              f'keystore/release="{os.environ["KEYSTORE_PATH"]}"\\n'
              f'keystore/release_user="{os.environ["KEYSTORE_USER"]}"\\n'
              f'keystore/release_password="{os.environ["KEYSTORE_PASS"]}"\\n'
          )
          if marker not in content:
              raise SystemExit("Android export preset options section is missing")
          content = content.replace(marker, marker + signing, 1)
          preset.write_text(content)
          PY

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BuildWorld-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildWorld-Android-APK
          path: build/BuildWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
